name: Daily Taiwan Stock Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install requests beautifulsoup4 matplotlib numpy

      - name: Step 1 - Prepare market data and chart
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py --prepare

      - name: Step 2 - Commit and push chart & margin history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add charts/
          git diff --staged --quiet || git commit -m "chore: update daily stock chart and margin history"
          git push

      - name: Step 3 - Send LINE broadcast
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py --send
