name: Daily Stock Line Push

on:
  schedule:
    # 台灣時間週一至週五 17:55（對應 UTC 09:55）自動執行
    - cron: '55 9 * * 1-5'
  workflow_dispatch: # 保留手動測試按鈕

permissions:
  contents: write # 允許自動將產出的圖表 Commit 回 Repo 作為圖床

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install requests beautifulsoup4 matplotlib

      - name: Run Stock Script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python main.py

      - name: Commit & Push Chart Image
        run: |
          if [ -f "charts/daily_chart.png" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add charts/daily_chart.png
            git diff --staged --quiet || git commit -m "chore: update daily stock chart"
            git push
          fi
